<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>업데이트 일정 역산 상황판 (MOCKUP v0.1)</title>
<style>
  body{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;margin:24px;
       background:#f6f7f9;color:#1b1f23}
  .card{background:#fff;border:1px solid #e1e4e8;border-radius:8px;padding:16px;margin-bottom:16px}
  h1{font-size:18px} h2{font-size:15px;margin:0 0 12px}
  label{display:inline-block;width:110px;font-size:13px}
  input,select{padding:6px;margin:4px 8px 4px 0;border:1px solid #ccc;border-radius:4px}
  button{padding:8px 16px;background:#0969da;color:#fff;border:0;border-radius:4px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}
  .ok{color:#1a7f37;font-weight:600}
  .warn{color:#9a6700;font-weight:600}
  .danger{color:#cf222e;font-weight:600}
  .note{background:#fff8c5;border:1px solid #d4a72c;padding:10px;font-size:12px;
        border-radius:4px;margin-bottom:16px}
</style>
</head>
<body>
<h1>업데이트 일정 역산 상황판 <small style="color:#666">(MOCKUP v0.1 &mdash; 데이터 미연동)</small></h1>

<div class="note">
  <b>본 목업은 검증되지 않은 중단된 프로토타입입니다.</b><br>
  화면 구성 참고용이며, 계산 로직과 데이터 연결은 지원자가 재설계해야 합니다.<br>
  소스코드 내 <code>FIXME</code> 주석 8곳을 확인하세요. 목업을 수정하셔도 되고 새로 작성하셔도 됩니다.<br>
  <b>본 과제의 기준일(오늘)은 2026-01-26입니다.</b>
</div>

<div class="card">
  <h2>입력</h2>
  <label>업데이트일</label><input type="date" id="releaseDate" value="2026-03-12">
  <label>콘텐츠</label>
  <select id="content">
    <option value="CLS">신규 클래스 추가 (SYSTEM / L)</option>
    <option value="EV11">봄 시즌 콘텐츠 (CONTENT / L)</option>
    <option value="FRD">친구 시스템 개편 (SYSTEM / M)</option>
  </select><br>
  <label>담당 기획자</label>
  <select id="owner">
    <option>pd_lee</option><option>pd_park</option>
    <option>pd_choi</option><option>pd_kim</option>
  </select>
  <button onclick="calc()">역산</button>
</div>

<div class="card">
  <h2>역산 결과</h2>
  <table id="result"><tbody><tr><td>역산 버튼을 눌러주세요.</td></tr></tbody></table>
</div>

<script>
/* ===== FIXME 1 =====
   MD 기준표가 소스코드에 하드코딩되어 있음.
   버전 종료 시 측정된 실적 MD가 이 값으로 되돌아올 경로가 전혀 없다.        */
const MD = {
  CLS : { type:"SYSTEM",  size:"L", plan:15, dev:30 },
  EV11: { type:"CONTENT", size:"L", plan:10, dev:18 },
  FRD : { type:"SYSTEM",  size:"M", plan:7,  dev:12 }
};

/* ===== FIXME 2 =====
   아트(리소스) MD와 QA MD가 아예 없음. 화면이 개발 MD만 보고 있다.          */

/* ===== FIXME 3 =====
   담당 기획자를 선택하지만 계산에 전혀 쓰이지 않음.
   people.csv의 가용률(availability), calendar.csv의 연차,
   그리고 해당 기간에 이미 맡고 있는 건수가 모두 미반영.                     */

/* ===== FIXME 8 =====
   기준일이 new Date()로 하드코딩되어 과거 시점 기준 검증이 불가능하다.
   as-of 날짜를 주입 가능한 구조로 바꿀 것. 본 과제의 기준일은 2026-01-26.  */
const AS_OF = null;   // → "2026-01-26" 등으로 주입 가능하게 변경 필요

function calc(){
  const rel = new Date(document.getElementById('releaseDate').value);
  const c   = MD[document.getElementById('content').value];

  /* ===== FIXME 4 =====
     단순 캘린더데이 뺄셈. 주말과 공휴일을 무시하고 있다.                    */
  const devStart  = addDays(rel, -c.dev);
  const planStart = addDays(devStart, -c.plan);

  /* ===== FIXME 5 =====
     QA/코드프리즈 기간, 기획 검수 기간(review_days),
     리소스 선행 기간(art_lead_days)이 역산 체인에서 통째로 빠져 있다.       */

  /* ===== FIXME 6 =====
     판정이 '여유 / 지연' 2단계뿐.
     구간별 경고 수준도, TF 제안 근거도, 대안 제시 로직도 없다.              */
  const today = new Date();
  const slack = Math.round((planStart - today) / 86400000);
  const verdict = slack >= 0
      ? '<span class="ok">여유</span>'
      : '<span class="danger">지연</span>';

  /* ===== FIXME 7 =====
     어떤 근거로 이 날짜가 나왔는지 화면에 전혀 노출되지 않아
     기획자가 결과를 신뢰할 수 없다.                                        */
  document.getElementById('result').innerHTML = `
    <tr><th>구분</th><th>일자</th></tr>
    <tr><td>업데이트 배포</td><td>${fmt(rel)}</td></tr>
    <tr><td>개발 착수</td><td>${fmt(devStart)}</td></tr>
    <tr><td>기획 착수</td><td>${fmt(planStart)}</td></tr>
    <tr><td>여유일</td><td>${slack}일 ${verdict}</td></tr>`;
}

function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmt(d){ return d.toISOString().slice(0,10); }
</script>

<!--
  참고: 현재 제공되는 API 규격은 아래와 같습니다.
  이 규격은 위 화면이 필요로 하는 값을 주지 못합니다. (산출물 C-3)
  {
    "endpoint": "/api/md_summary",
    "source":   "clickhouse.md_actual",
    "fields":   ["version", "epic_key", "total_timespent_hours", "issue_count"]
  }
-->
</body>
</html>
